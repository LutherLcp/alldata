version: '3.8'

# 环境变量来源：根目录 .env（请先 cp .env.example .env）
# 必填变量使用 ${VAR:?msg} 语法，缺失时 compose 会直接报错，避免误用默认密钥。

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: alldata-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alldata}
      POSTGRES_USER: ${POSTGRES_USER:-alldata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alldata} -d ${POSTGRES_DB:-alldata}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alldata-network

  # Cache
  redis:
    image: redis:7-alpine
    container_name: alldata-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alldata-network

  # Object Storage
  minio:
    image: minio/minio:latest
    container_name: alldata-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required, see .env.example}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - alldata-network

  # OLAP Analytics Database
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: alldata-clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-alldata}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alldata-network

  # API Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: alldata-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-alldata}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-alldata}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, see .env.example}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required, see .env.example}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required, see .env.example}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-alldata}
      MINIO_USE_SSL: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-alldata}
      # AI / LLM（留空走 mock 降级）
      LLM_PROVIDER: ${LLM_PROVIDER:-OPENAI}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - alldata-network

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: alldata-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:4000}
    depends_on:
      - api
    networks:
      - alldata-network

  # Database migration (run once)
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: alldata-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alldata}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-alldata}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "sleep 5 && pnpm db:migrate"
    networks:
      - alldata-network
    profiles:
      - migrate

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clickhouse_data:

networks:
  alldata-network:
    driver: bridge
