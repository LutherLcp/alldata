version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alldata-postgres-test
    environment:
      POSTGRES_DB: alldata_test
      POSTGRES_USER: alldata
      POSTGRES_PASSWORD: alldata123
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alldata -d alldata_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - alldata-test-network

  redis:
    image: redis:7-alpine
    container_name: alldata-redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - alldata-test-network

  minio:
    image: minio/minio:latest
    container_name: alldata-minio-test
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_test_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - alldata-test-network

volumes:
  postgres_test_data:
  redis_test_data:
  minio_test_data:

networks:
  alldata-test-network:
    driver: bridge