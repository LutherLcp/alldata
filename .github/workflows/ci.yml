name: CI

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.6.0'

jobs:
  quality:
    name: Lint · TypeCheck · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint (Biome, all packages)
        run: pnpm lint

      - name: TypeCheck (all packages)
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      # 当前测试不依赖外部服务（api 集成测试待 R1 重写，见 apps/api/tests/_legacy/README.md）
      - name: Run tests (all packages)
        run: pnpm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-testing-only-at-least-32
          COOKIE_SECRET: test-cookie-secret-for-testing-only-32chars

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build all packages
        run: pnpm build
        env:
          # 构建期 prisma generate 需要占位连接串，不建立真实连接
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [tests, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: alldata/api:${{ github.sha }}
          load: true

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: alldata/web:${{ github.sha }}
          load: true

# 说明：
# - E2E（Playwright）作业已移除：仓库尚无 apps/web/playwright.config.ts 与用例，
#   原作业必然失败。E2E 冒烟为 R1 交付项（见 docs/reports/roadmap-2026-2027.md）。
# - 原 ci.yml 触发分支写作 main/develop，而仓库实际使用 master，导致 CI 从未运行；
#   同时健康检查路径写为 /api/v1/health（实际为 /api/health）。
